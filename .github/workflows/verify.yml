name: Verify HammerXI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app syntax
        run: node --check app.js
      - name: Check data syntax
        run: node --check data.js
      - name: Verify auction catalogue and pool rules
        run: node scripts/verify.mjs
      - name: Smoke-test browser startup
        run: node scripts/smoke.mjs
