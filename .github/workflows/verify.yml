name: Verify HammerXI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check app syntax
        run: node --check app.js
      - name: Check data syntax
        run: node --check data.js
      - name: Verify auction catalogue and pool rules
        run: node scripts/verify.mjs
      - name: Verify HammerXI V2.2 flow
        run: node scripts/verify-v2.mjs
      - name: Verify mobile responsiveness guards
        run: node scripts/verify-mobile.mjs
      - name: Run V2 engine regression suite
        run: node scripts/regression-v2.mjs
      - name: Run 10-team post-auction endurance
        run: node scripts/max-room-post-auction.mjs
      - name: Verify Trystero adapter contract
        run: node scripts/network-contract.mjs
      - name: Smoke-test browser startup
        run: node scripts/smoke.mjs
      - name: Build production bundle
        run: npm run build
      - name: Verify production bundle exists
        run: test -s dist/app.js && test -s dist/index.html && test -s dist/styles.css && test -s dist/ceremony.js
      - name: Enforce production performance budget
        run: node scripts/perf-budget.mjs
      - name: Install Chromium for browser endurance QA
        run: npx playwright install --with-deps chromium
      - name: Run 10-team browser endurance and mobile matrix
        run: npx playwright test
